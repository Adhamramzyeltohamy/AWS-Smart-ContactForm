<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Contact Form</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #34495e;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #219150;
        }
        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }
        #statusMessage {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-weight: bold;
        }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>

<div class="container">
    <h2>تواصل معنا (Smart AI Portal)</h2>
    <form id="contactForm">
        <div class="form-group">
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" required placeholder="أدخل اسمك">
        </div>
        <div class="form-group">
            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" required placeholder="example@domain.com">
        </div>
        <div class="form-group">
            <label for="subject">العنوان:</label>
            <input type="text" id="subject" required placeholder="موضوع الرسالة">
        </div>
        <div class="form-group">
            <label for="message">الرسالة:</label>
            <textarea id="message" required placeholder="اكتب رسالتك هنا..."></textarea>
        </div>
        <button type="submit" id="submitBtn">إرسال الرسالة</button>
    </form>
    <div id="statusMessage"></div>
</div>

<script>
   const API_POST_URL = "https://l8xvbka1pd.execute-api.eu-north-1.amazonaws.com/new/messages";

    document.getElementById('contactForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMessage');
        
        btn.disabled = true;
        btn.innerText = "جاري الإرسال والتحليل بالذكاء الاصطناعي...";
        statusMsg.style.display = "none";

        const formData = {
            name: document.getElementById('name').value.trim(),
            email: document.getElementById('email').value.trim(),
            subject: document.getElementById('subject').value.trim(),
            message: document.getElementById('message').value.trim()
        };

        try {
            const response = await fetch(API_POST_URL, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(formData)
            });
            
            const result = await response.json();
            
            if (response.ok) {
                statusMsg.className = "success";
                statusMsg.innerText = `تم الإرسال بنجاح! التصنيف: ${result.category || 'General'} (الأولوية: ${result.priority || 'LOW'})`;
                statusMsg.style.display = "block";
                document.getElementById('contactForm').reset();
            } else {
                throw new Error(result.error || `خطأ من السيرفر (كود: ${response.status})`);
            }
        } catch (err) {
            statusMsg.className = "error";
            statusMsg.innerText = "فشل الإرسال: " + err.message;
            statusMsg.style.display = "block";
            console.error("Fetch Error:", err);
        } finally {
            btn.disabled = false;
            btn.innerText = "إرسال الرسالة";
        }
    });
</script>
</body>
</html>
